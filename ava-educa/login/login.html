<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Sistema</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../css/style.css">
  <!-- Módulos permitem o uso de import/export diretamente no navegador -->
  <script src="login.js" type="module" defer></script>
</head>

<body>

  <main>
    <h2>AVA-Educa+</h2>

    <form id="formLogin">
      <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>

      <div>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required placeholder="Digite sua senha">
      </div>

      <button type="submit" id="btnEntrar">Entrar</button>
    </form>

    <p>
      <a href="esqueceu-senha.html" id="linkResetarSenha">Esqueceu a senha?</a>
    </p>

    <!-- Elemento opcional para exibir mensagens de erro na tela -->
    <p id="mensagemErro" style="color: red; font-weight: bold;"></p>
  </main>

</body>

</html>
