<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de aluno</title>
  <link rel="stylesheet" href="cadastro-aluno.css">
  <script type="module" src="./cadastro-aluno.js" defer></script>
</head>

<body>
  <header class="toolbar">
    <div class="toolbar-brand">AVA-EDUCA+</div>
    <div class="toolbar-user" id="nomeUsuarioHeader">Carregando...</div>
  </header>

  <!-- CONTAINER DO CORPO DA PÁGINA (MENU LATERAL + CONTEÚDO) -->
  <div class="app-container">

    <!-- 2. MENU LATERAL (SIDEBAR) -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="../dashboard/dashboard.html" class="nav-btn target-active">Dashboard</a>
        <button class="nav-btn" disabled title="Funcionalidade indisponível">Cursos</button>
        <a href="../cadastro-aluno/cadastro-aluno.html" class="nav-btn">Cadastro de Alunos</a>
        <button id="btnSair" class="nav-btn btn-sair" type="button">Sair</button>
      </nav>
    </aside>

    <main class="conteudo-principal">
      <div class="dashboard-header">
        <h1>Cadastro de Novo Aluno</h1>
        <p>Preencha todas as informações obrigatórias para registrar o estudante.</p>
      </div>

      <!-- Alerta visual para erros JavaScript -->
      <div id="mensagemErro" class="aviso-erro" role="alert" style="display: none;"></div>
      <div id="mensagemSucesso" class="aviso-sucesso" role="status" style="display: none;"></div>

      <form id="formCadastroAluno" class="form-cadastro">

        <!-- SEÇÃO: DADOS PESSOAIS -->
        <fieldset class="form-section">
          <legend>Dados Pessoais</legend>

          <div class="form-row">
            <div class="form-group flex-2">
              <label for="nomeCompleto">Nome Completo *</label>
              <input type="text" id="nomeCompleto" required minlength="4" maxlength="80"
                placeholder="Nome Completo do Aluno">
            </div>

            <div class="form-group flex-1">
              <label for="genero">Gênero *</label>
              <select id="genero" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
                <option value="O">Outro</option>
                <option value="N">Prefiro não declarar</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="dataNascimento">Data de Nascimento *</label>
              <input type="date" id="dataNascimento" required min="1900-01-02">
            </div>

            <div class="form-group">
              <label for="cpf">CPF (Apenas números) *</label>
              <input type="text" id="cpf" required pattern="\d+" placeholder="Ex: 12345678901">
            </div>

            <div class="form-group">
              <label for="telefone">Telefone (Apenas números) *</label>
              <input type="text" id="telefone" required pattern="\d+" placeholder="Ex: 11999999999">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-full">
              <label for="email">E-mail *</label>
              <input type="email" id="email" required placeholder="exemplo@email.com">
            </div>
          </div>
        </fieldset>

        <!-- SEÇÃO: ENDEREÇO -->
        <fieldset class="form-section">
          <legend>Endereço</legend>

          <div class="form-row">
            <div class="form-group">
              <label for="cep">CEP (Apenas números) *</label>
              <input type="text" id="cep" required pattern="\d+" placeholder="Ex: 88000000">
            </div>

            <div class="form-group flex-2">
              <label for="logradouro">Logradouro *</label>
              <input type="text" id="logradouro" required placeholder="Rua, Avenida, etc.">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="numero">Número *</label>
              <input type="text" id="numero" required pattern="\d+" placeholder="Ex: 123">
            </div>

            <div class="form-group flex-2">
              <label for="complemento">Complemento</label>
              <input type="text" id="complemento" placeholder="Apto, Bloco, etc. (Opcional)">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="bairro">Bairro *</label>
              <input type="text" id="bairro" required placeholder="Bairro">
            </div>

            <div class="form-group">
              <label for="cidade">Cidade *</label>
              <input type="text" id="cidade" required placeholder="Cidade">
            </div>

            <div class="form-group">
              <label for="estado">Estado *</label>
              <input type="text" id="estado" required placeholder="Estado">
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn-salvar">Salvar Cadastro</button>
        </div>

      </form>
    </main>
  </div>
</body>

</html>
