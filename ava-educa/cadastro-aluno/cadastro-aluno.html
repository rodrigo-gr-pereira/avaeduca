<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de aluno</title>
  <link rel="stylesheet" href="cadastro-aluno.css">
  <script type="module" src="./cadastro-aluno.js" defer></script>
</head>

<body>
  <header class="toolbar">
    <div class="toolbar-brand">AVA-EDUCA+</div>
    <div class="toolbar-user" id="nomeUsuarioHeader">Carregando...</div>
  </header>

  <main>
    <h1>Cadastrar aluno</h1>
    <form id="formCadastroAluno">
      <div>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required />
      </div>
      <div>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" type="text" required />
      </div>
      <button type="submit">Salvar</button>
    </form>
    <p id="mensagemCadastro"></p>
    <p><a href="../dashboard/dashboard.html">Voltar para o dashboard</a></p>

  </main>
</body>

</html>
